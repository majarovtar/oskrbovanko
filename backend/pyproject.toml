[project]
name = "mojodpust-backend"
version = "0.1.0"
description = "MojOdpust backend - daily AI check-in calls to discharged patients, their vitals, summaries and alerts."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "websockets>=13.0",
  "python-dotenv>=1.0",
  "resend>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended pattern.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
